{% extends "base.html" %}
{% block title %}{% if visit %}Edit Vet Visit{% else %}Record Vet Visit{% endif %} — PetCare+{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-header bg-white py-3 border-bottom">
        <h5 class="fw-bold mb-0 text-dark">
          <i class="fa-solid fa-user-md text-danger me-2"></i>
          {% if visit %}Edit Veterinary Visit Record{% else %}Record Veterinary Consultation{% endif %}
        </h5>
      </div>
      <div class="card-body p-4">
        <form action="{% if visit %}{{ url_for('vet_visits.edit_visit', visit_id=visit.id) }}{% else %}{{ url_for('vet_visits.add_visit') }}{% endif %}" method="POST" enctype="multipart/form-data">
          
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted fs-7">Select Pet *</label>
              <select name="pet_id" class="form-select" required {% if visit %}disabled{% endif %}>
                <option value="">Select Pet...</option>
                {% for pet in user_pets %}
                <option value="{{ pet.id }}" {% if (visit and visit.pet_id==pet.id) or (preset_pet_id==pet.id) %}selected{% endif %}>{{ pet.name }} ({{ pet.species }})</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted fs-7">Reason for Visit *</label>
              <input type="text" name="reason" class="form-control" value="{{ visit.reason if visit else '' }}" placeholder="e.g. Annual Check-up, Ear Infection" required>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label text-muted fs-7">Visit Date *</label>
              <input type="date" name="visit_date" class="form-control" value="{{ visit.visit_date if visit else '' }}" required>
            </div>

            <div class="col-md-4">
              <label class="form-label text-muted fs-7">Appointment Time</label>
              <input type="text" name="visit_time" class="form-control" value="{{ visit.visit_time if visit else '' }}" placeholder="e.g. 10:30 AM">
            </div>

            <div class="col-md-4">
              <label class="form-label text-muted fs-7">Follow-up Date (Optional)</label>
              <input type="date" name="follow_up_date" class="form-control" value="{{ visit.follow_up_date if visit and visit.follow_up_date else '' }}">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted fs-7">Veterinarian Name</label>
              <input type="text" name="vet_name" class="form-control" value="{{ visit.vet_name if visit else '' }}" placeholder="e.g. Dr. Robert Hayes">
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted fs-7">Clinic / Hospital Name</label>
              <input type="text" name="clinic" class="form-control" value="{{ visit.clinic if visit else '' }}" placeholder="e.g. City Pet Hospital">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fs-7">Diagnosis / Findings</label>
            <textarea name="diagnosis" class="form-control" rows="2" placeholder="e.g. Slight dental tartar buildup, normal heart rate">{{ visit.diagnosis if visit else '' }}</textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label text-muted fs-7">Treatment Provided</label>
              <textarea name="treatment" class="form-control" rows="2" placeholder="e.g. Prescribed dental chews">{{ visit.treatment if visit else '' }}</textarea>
            </div>

            <div class="col-md-6">
              <label class="form-label text-muted fs-7">Prescription Details</label>
              <textarea name="prescription" class="form-control" rows="2" placeholder="e.g. Apoquel 16mg once daily for 10 days">{{ visit.prescription if visit else '' }}</textarea>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fs-7">Attach Prescription / Clinical Report Document (PDF/Image)</label>
            <input type="file" name="document" class="form-control" accept="image/*,.pdf">
          </div>

          <div class="mb-4">
            <label class="form-label text-muted fs-7">Additional Clinical Notes</label>
            <textarea name="notes" class="form-control" rows="2" placeholder="e.g. Pet was calm during exam">{{ visit.notes if visit else '' }}</textarea>
          </div>

          <div class="d-flex justify-content-between align-items-center">
            <a href="{{ url_for('vet_visits.list_visits') }}" class="btn btn-light border text-muted">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 fw-semibold shadow-sm">
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Vet Visit Record
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
